{% extends "layout.html" %}
{% block content %}

<div class="login-wrapper" style="display: flex; align-items: center; justify-content: center; min-height: 60vh;">
    <div class="dash-card" style="width: 100%; max-width: 400px; border-left: 6px solid var(--maroon);">
        <div class="dashboard-header">
            <h2>Sign In</h2>
            <p style="font-size: 14px; opacity: 0.7;">HLP Management System</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div style="margin-bottom: 15px;">
                <label style="font-weight: 600; font-size: 14px;">Username</label>
                <input type="text" name="username" placeholder="Enter username" required 
                       style="background: #f9f9f9; border: 1px solid #ddd; padding: 12px; width: 100%; box-sizing: border-box; border-radius: 4px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="font-weight: 600; font-size: 14px;">Password</label>
                <input type="password" name="password" placeholder="Enter password" required
                       style="background: #f9f9f9; border: 1px solid #ddd; padding: 12px; width: 100%; box-sizing: border-box; border-radius: 4px;">
            </div>

            <button type="submit" class="btn primary" style="width: 100%; padding: 12px; font-weight: bold; font-size: 16px;">
                Log In
            </button>
        </form>

        <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #eee; text-align: center;">
            <p style="font-size: 12px; color: #999; margin-bottom: 8px;">
                Restricted Access: Authorized Personnel Only
            </p>
            <div style="font-size: 11px; color: var(--gold); display: flex; flex-direction: column; gap: 4px;">
                <span><strong>Technician Default:</strong> technician / 123</span>
                <span><strong>Supervisor / Admin:</strong> Standard Credentials</span>
            </div>
        </div>
    </div>
</div>

{% endblock %}
